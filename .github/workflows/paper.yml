name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1/24 * * *"

permissions:
  contents: write

concurrency:
  group: paper-daily-main
  cancel-in-progress: false

jobs:
  build:
    name: update
    # A manual run on a repair branch must never publish production data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Keep an existing publishing token; otherwise use this job's scoped token.
          token: ${{ secrets.GIT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate archive and run offline tests
        run: |
          python paper_store.py validate
          python -m unittest discover -s tests -v

      - name: Crawl papers and generate summaries
        env:
          LLM_API_KEY: ${{ secrets.PAPER_TOKEN }}
          LLM_PROMPT: ${{ vars.EMBODIED_PROMPT }}
        run: python paper_daily.py

      - name: Build site
        run: python create_index.py

      - name: Validate and publish generated files
        run: |
          python paper_store.py validate
          git add -- README.md index.html data/papers
          python scripts/check_staged_sizes.py
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
            exit 0
          fi
          git config user.name 'Xunmenggod'
          git config user.email 'blackxunmeng@gmail.com'
          git commit -m 'Github Action Automatic Update CV Papers'
          # Reject concurrent main changes instead of overwriting or force-pushing.
          git push origin HEAD:main
